###########################
# 1️⃣ 终端与颜色
###########################
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

###########################
# 2️⃣ 前缀键
###########################
unbind C-b                # 解绑默认 Ctrl+B
set -g prefix C-a         # 前缀改 Ctrl+A
bind C-a send-prefix       # 再发一次前缀给 tmux

###########################
# 3️⃣ 窗口与 pane
###########################
set -g base-index 1        # window 从 1 开始
setw -g pane-base-index 1  # pane 从 1 开始

# 分屏快捷键（仍可用）
bind | split-window -h -c "#{pane_current_path}"  # 横向分屏
bind - split-window -v -c "#{pane_current_path}"  # 纵向分屏

# vim 风格切换 pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

###########################
# 4️⃣ 历史缓冲与 shell
###########################
set -g history-limit 100000     # 大历史缓冲

# shell：显式指定 fish。不要用 "${SHELL}"，那取的是启动 tmux server 的
# 父进程环境变量（从 bash 脚本里起 server 就会变成 bash）
if-shell '[ -x /usr/bin/fish ]' \
    'set -g default-shell /usr/bin/fish ; set -g default-command ""'

# 保持 window 即使 shell 或命令退出
set -g remain-on-exit on

###########################
# 5️⃣ 鼠标
###########################
set -g mouse on
# ✅ 鼠标可滚历史，可选 pane，可 resize
# 注意：鼠标拖拽复制在大部分现代终端仍使用 Shift+拖拽，不影响 Ctrl+V

###########################
# 6️⃣ 状态栏
###########################
set -g status-style bg=black,fg=white
set -g status-left "[#S:#I.#P] "  # session:window.pane
set -g status-right "%Y-%m-%d %H:%M"

###########################
# 7️⃣ 复制模式
###########################
setw -g mode-keys vi       # vim 风格
# 使用 tmux copy-mode 的情况下：
# 进入复制模式 Ctrl+A [
# 选区 v，复制 y，粘贴 Ctrl+A ]

###########################
# 8️⃣ reload 配置
###########################
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  
# 使用方法：Ctrl+A 然后 r

###########################
# ⚠️ 提醒：shell timeout
###########################
# 为避免 tmux window shell 自动退出，请在 ~/.bashrc 或 ~/.zshrc 中加：
# unset TMOUT

###########################
# 9️⃣ 小提示
###########################
# - 新 window 会继承当前目录
# - window workflow 推荐：Ctrl+A c 创建
# - pane workflow 可选：Ctrl+A | 或 Ctrl+A -
# - 滚历史可用鼠标滚轮，也可 Ctrl+A [
# - 复制粘贴建议使用终端快捷键 Ctrl+Shift+C / Ctrl+Shift+V

###########################
# >>> hint-bar + popup (aligned with NAS, 2026-09-22)
###########################
set -g status 2
set -g status-format[1] "#[align=left]#{?client_prefix,#[bg=colour33#,fg=black#,bold] C-a #[default] #[fg=white#,bold]|#[fg=colour245] split  #[fg=white#,bold]x#[fg=colour245] close-pane  #[fg=white#,bold]t#[fg=colour245] sessions  #[fg=white#,bold]d#[fg=colour245] detach  #[fg=white#,bold]?#[fg=colour245] all keys,#[fg=colour240] C-a then ? for all keys}"
bind t display-popup -w 90% -h 75% -E "~/.local/bin/tmux-tui"
# <<< hint-bar + popup
